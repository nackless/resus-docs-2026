<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
    <linearGradient id="fav-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fav-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Outer Document Card with Shadow -->
  <rect x="8" y="6" width="48" height="52" rx="10" fill="url(#fav-bg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Document Fold Notch -->
  <path d="M 44 6 L 56 18 L 44 18 Z" fill="#1e293b" />
  
  <!-- Clinical Medical Cross Symbol -->
  <path d="M 32 16 V 30 M 25 23 H 39" stroke="url(#fav-doc)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Resuscitation ECG Waveform Pulse -->
  <path d="M 12 40 L 21 40 L 24 35 L 27 47 L 31 22 L 36 44 L 40 37 L 44 40 L 52 40" 
        stroke="url(#fav-pulse)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Glowing Heartbeat Dot -->
  <circle cx="52" cy="40" r="2.5" fill="#06b6d4" />
</svg>
