<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" rx="16" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">REASON TRIAL: POCUS IN CARDIAC ARREST</text>
  <text x="400" y="70" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">Subxiphoid &amp; Parasternal Cardiac Standstill Analysis</text>
  
  <!-- Ultrasound Fan Monitor Screen -->
  <path d="M 250 120 L 550 120 L 680 340 L 120 340 Z" fill="#091322" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Echo Myocardium Silhouette -->
  <ellipse cx="400" cy="220" rx="120" ry="60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="400" cy="220" r="25" fill="none" stroke="#ef4444" stroke-width="2"/>
  
  <text x="400" y="225" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle">NO MOTION</text>
  
  <!-- Overlay Data Grid -->
  <rect x="50" y="360" width="700" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="395" fill="#a78bfa" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ROSC Rate with Standstill: 0.6%</text>
  <text x="600" y="395" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ROSC Rate with Motion: 35.0%</text>
</svg>
